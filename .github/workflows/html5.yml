name: Build HTML5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libffi8 libssl-dev
          # Fix the libffi symlink issue
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 /usr/lib/x86_64-linux-gnu/libffi.so.6 || true
          sudo ldconfig

      - name: Install libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install hxcpp --quiet

      - name: Select versions
        run: |
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.10.0
          haxelib set flixel-ui 2.5.0

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Build HTML5
        run: |
          haxelib run lime build html5 -verbose
        timeout-minutes: 30

      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: B-Verse-HTML5
          path: export/release/html5/bin
